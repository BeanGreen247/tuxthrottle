# osu-lazer-tools is a folder of scripts, not a Python package. This file only carries lint/test config.

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
