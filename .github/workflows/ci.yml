name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON config
        run: |
          for f in config/*.json; do python -c "import json,sys; json.load(open('$f')); print('ok', '$f')"; done

      - name: Shell syntax
        run: bash -n install.sh uninstall.sh verify-install.sh purge-legacy-dellg15.sh cpp/install.sh

      - name: Client scripts compile
        run: sh -n clients/waybar/tuxthrottle-waybar clients/mangohud/tuxthrottle-mangohud

      - name: Validate model profiles
        run: |
          for f in models/*.json; do python -c "import json; d=json.load(open('$f')); assert d['id']=='$f'.split('/')[-1][:-5], d['id']; print('ok', '$f')"; done

      - name: RPM spec lint
        run: |
          sudo dnf -y install rpm-build rpmlint >/dev/null 2>&1 || sudo apt-get install -y rpm >/dev/null 2>&1 || true
          rpmspec -P packaging/tuxthrottle.spec --define "_version 0.1.0" >/dev/null && echo "spec parses" || echo "rpmspec not available - skipped"

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq meson ninja-build g++ libsdl2-dev libfreetype-dev libfontconfig-dev
      - name: Build
        run: meson setup cpp/build-ci cpp && ninja -C cpp/build-ci
      - name: Unit tests
        run: meson test -C cpp/build-ci core --print-errorlogs
